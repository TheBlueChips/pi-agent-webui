<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Agent</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%235b9dff'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Georgia'%3E%CF%80%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <!-- ══════════ Sidebar ══════════ -->
  <aside id="sidebar">
    <div class="sidebar-head">
      <span class="logo" id="agent-title">pi agent</span>
      <button id="btn-new-session" class="btn primary" title="Start a new session">+ New</button>
    </div>
    <div class="sidebar-search">
      <input id="session-filter" type="search" placeholder="Filter sessions…">
      <button id="btn-refresh-sessions" class="btn icon" title="Refresh session list">⟳</button>
    </div>
    <div id="session-list" class="session-list"></div>
  </aside>

  <!-- ══════════ Main ══════════ -->
  <main id="main">
    <header id="topbar">
      <button id="btn-toggle-sidebar" class="btn icon" title="Toggle sidebar">☰</button>
      <input id="session-name" class="session-name" placeholder="Unnamed session" title="Click to rename">
      <button id="btn-reels" class="btn">Reels</button>
      <button id="btn-settings" class="btn icon" title="Settings: agent name, avatar, TTS voice, voice input, thinking, theme">⚙</button>
      <button id="btn-tts" class="btn toggle" title="Speak agent replies out loud (TTS)">TTS off</button>
      <span id="conn-dot" class="conn-dot" title="Connection status"></span>
    </header>

    <div id="banner" class="banner hidden"></div>

    <div id="chat"></div>

    <div id="queue-bar" class="queue-bar hidden"></div>
    <div id="widget-bar" class="widget-bar hidden"></div>
    <div id="status-bar" class="status-bar hidden"></div>

    <!-- ══════════ Composer ══════════ -->
    <div id="composer">
      <div id="edit-banner" class="edit-banner hidden">
        <span id="edit-banner-text"></span>
        <button id="btn-cancel-edit" class="btn small">cancel edit</button>
      </div>
      <div id="attachments" class="attachments hidden"></div>
      <div class="composer-row">
        <button id="btn-attach" class="btn icon" title="Attach images">+</button>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message the agent" autocomplete="off"></textarea>
        <button id="btn-mic" class="btn icon" title="Voice to text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button id="btn-stop" class="btn stop hidden" title="Stop (Esc)">Stop</button>
        <button id="btn-send" class="btn primary" title="Send (Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.99.99 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
        </button>
      </div>
      <div id="stats-bar">
        <span class="ctx-ring" title="Context window used">
          <svg viewBox="0 0 40 40" width="38" height="38">
            <circle class="ring-bg" cx="20" cy="20" r="16" fill="none" stroke-width="4.5"></circle>
            <circle class="ring-fg" id="ctx-ring-fg" cx="20" cy="20" r="16" fill="none" stroke-width="4.5" stroke-dasharray="0 999" stroke-linecap="round" transform="rotate(-90 20 20)"></circle>
            <text id="ctx-ring-text" x="20" y="24.5" text-anchor="middle">–</text>
          </svg>
        </span>
        <span id="ctx-label" class="ctx-label" title="Context tokens used / model context window"></span>
        <span id="stat-tokens" title="session tokens read / written">↑ – · ↓ –</span>
        <span id="stat-cost" title="session cost"></span>
        <span class="stats-spacer"></span>
        <select id="model-select" title="Model"></select>
        <select id="thinking-select" title="Thinking level"></select>
      </div>
    </div>
  </main>
</div>

<!-- Extension dialog modal -->
<dialog id="ext-dialog">
  <h3 id="ext-dialog-title">Agent</h3>
  <p id="ext-dialog-message" class="hidden"></p>
  <div id="ext-dialog-body"></div>
  <div class="dialog-buttons">
    <button id="ext-dialog-cancel" class="btn">Cancel</button>
    <button id="ext-dialog-ok" class="btn primary">OK</button>
  </div>
</dialog>

<!-- Settings dialog -->
<dialog id="settings-dialog">
  <h3>Settings</h3>
  <div class="settings-grid">
    <label>Agent name</label>
    <input id="set-agent-name" type="text" placeholder="pi">
    <label>Profile image</label>
    <div class="avatar-row">
      <img id="set-avatar-preview" class="avatar avatar-big" alt="">
      <button id="btn-avatar-upload" class="btn small">upload…</button>
      <button id="btn-avatar-clear" class="btn small">clear</button>
      <input id="avatar-input" type="file" accept="image/*" hidden>
    </div>
    <label>TTS voice</label>
    <select id="set-tts-voice"></select>
    <label>Speech rate</label>
    <div class="rate-row">
      <input id="set-tts-rate" type="range" min="0.5" max="2" step="0.05" value="1.05">
      <span id="set-tts-rate-val">1.05</span>
      <button id="btn-tts-test" class="btn small">test</button>
    </div>
    <label>Voice input</label>
    <label class="check-label"><input id="set-voice-autosend" type="checkbox"> auto-send after voice input</label>
    <label>Whisper endpoint</label>
    <input id="set-stt-endpoint" type="text" placeholder="http://localhost:8080/inference or …/v1/audio/transcriptions">
    <label>Voice input backend</label>
    <select id="set-stt-backend">
      <option value="whisper">Whisper server</option>
      <option value="browser">Browser (Chrome/Edge only)</option>
    </select>
    <label>Thinking</label>
    <label class="check-label"><input id="set-show-thinking" type="checkbox"> show thinking blocks</label>
    <label></label>
    <label class="check-label"><input id="set-expand-thinking" type="checkbox"> auto-expand thinking blocks</label>
    <label>Tool calls</label>
    <label class="check-label"><input id="set-expand-tools" type="checkbox"> auto-expand tool call output</label>
    <label>TTS backend</label>
    <select id="set-tts-backend"><option value="browser">Browser voices</option><option value="endpoint">Local TTS server (Piper etc.)</option></select>
    <label>TTS server URL</label>
    <input id="set-tts-endpoint" type="text" placeholder="http://localhost:8880/v1/audio/speech">
    <label>TTS model / voice</label>
    <div class="rate-row">
      <input id="set-tts-model" type="text" placeholder="model, e.g. piper">
      <input id="set-tts-voice-name" type="text" placeholder="voice, e.g. en_US-amy-medium">
    </div>
    <label>Theme color</label>
    <div class="rate-row">
      <input id="set-accent" type="color" value="#5b9dff">
      <button id="btn-accent-reset" class="btn small">default</button>
    </div>
    <label>Background</label>
    <div class="rate-row">
      <input id="set-bg-url" type="text" placeholder="image URL">
      <button id="btn-bg-upload" class="btn small">upload…</button>
      <button id="btn-bg-clear" class="btn small">clear</button>
      <input id="bg-input" type="file" accept="image/*" hidden>
    </div>
  </div>
  <div class="dialog-buttons">
    <button id="settings-close" class="btn primary">Done</button>
  </div>
</dialog>

<div id="toasts"></div>
<div id="drop-overlay" class="drop-overlay hidden">Drop images to attach</div>



<script src="app.js"></script>
</body>
</html>
